<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <rect width="100" height="100" fill="#efebe9"/>
  <!-- Plain Japanese Traditional Paper Umbrella (Wagasa) -->
  <path d="M 15 60 Q 50 15 85 60 Z" fill="#8d6e63"/>
  <line x1="50" y1="15" x2="50" y2="60" stroke="#d7ccc8" stroke-width="1.5"/>
  <line x1="50" y1="15" x2="28" y2="55" stroke="#d7ccc8" stroke-width="1"/>
  <line x1="50" y1="15" x2="72" y2="55" stroke="#d7ccc8" stroke-width="1"/>
  <line x1="50" y1="15" x2="40" y2="58" stroke="#d7ccc8" stroke-width="1"/>
  <line x1="50" y1="15" x2="60" y2="58" stroke="#d7ccc8" stroke-width="1"/>
  <!-- Wooden Handle and stick -->
  <line x1="50" y1="60" x2="50" y2="92" stroke="#5d4037" stroke-width="4" stroke-linecap="round"/>
  <path d="M 50 88 Q 50 96 42 96" stroke="#5d4037" stroke-width="4" fill="none" stroke-linecap="round"/>
